<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eternal Mana</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 30 16 16 30 2 16z' fill='%232a78d8' stroke='%23e3b75c' stroke-width='3'/%3E%3Cpath d='M16 11l5 5-5 5-5-5z' fill='%23eafffb'/%3E%3C/svg%3E">
<link rel="stylesheet" href="launcher.css">
</head>
<body>
<div class="bg" id="bgA"></div>
<div class="bg" id="bgB"></div>
<div class="veil"></div>

<main class="shell">
  <header class="brand">
    <div class="crest" aria-hidden="true"><i></i></div>
    <div>
      <h1>Eternal Mana</h1>
      <p class="tag">Wo die Quelle noch flüstert</p>
    </div>
    <div class="ver" id="ver"></div>
  </header>

  <section class="left">
    <div class="card server" id="serverCard">
      <div class="card-head">
        <span class="dot" id="srvDot"></span>
        <h2 id="srvTitle">Server</h2>
        <span class="pill" id="srvOnline" hidden></span>
      </div>
      <p class="muted" id="srvText"></p>
      <ul class="addrs" id="srvAddrs"></ul>
      <label class="join">
        <span>Bei jemandem mitspielen</span>
        <input id="joinAddr" type="text" spellcheck="false" autocomplete="off" placeholder="Adresse, z. B. 100.101.102.103">
      </label>
    </div>
  </section>

  <aside class="card notes">
    <div class="card-head"><h2>Neuigkeiten</h2><span class="pill gold" id="newBadge" hidden>Neu</span></div>
    <div class="scroll" id="notes"></div>
  </aside>

  <footer class="dock">
    <div class="status">
      <div class="line">
        <strong id="label">Suche nach Aktualisierungen …</strong>
        <span id="pct"></span>
      </div>
      <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="fill"></i></div>
      <div class="line small">
        <span id="detail"></span>
        <span class="links">
          <button class="link" id="btnAction" hidden></button>
          <button class="link" id="btnCheck" title="Erneut nach Aktualisierungen suchen">Nach Updates suchen</button>
          <button class="link" id="btnRepair" title="Alle Spieldateien prüfen und beschädigte neu laden">Dateien prüfen</button>
        </span>
      </div>
    </div>
    <div class="buttons">
      <button class="btn" id="btnServer" disabled>Server starten</button>
      <button class="btn primary" id="btnPlay" disabled>Spiel starten</button>
    </div>
  </footer>
</main>
<div class="lost" id="lost" hidden>Verbindung zum Launcher verloren. Bitte den Launcher neu starten.</div>
<script src="launcher.js"></script>
</body>
</html>
